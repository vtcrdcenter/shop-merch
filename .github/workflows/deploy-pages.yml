name: Deploy museum shop to GitHub Pages

on:
  push:
    branches:
      - feat/museum-shop-demo

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static website
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking dist/client..."
          test -d dist/client
          test -f dist/client/index.html
          test -f dist/client/products/dau-an-thuong-trieu-nguyen/index.html
          test -f dist/client/collections/dau-an-cung-dinh-nguyen/index.html
          test -f dist/client/stories/mu-thuong-trieu-va-dau-an-thuong-trieu/index.html
          echo "Build output OK"

      - name: Disable Jekyll
        run: touch dist/client/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
